<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5A2B',
                        secondary: '#D2B48C',
                        board: '#DEB887',
                        black: '#000000',
                        white: '#FFFFFF',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .piece-shadow {
                filter: drop-shadow(0 2px 2px rgb(0 0 0 / 0.18));
            }
            .btn-hover {
                transition: all 0.2s ease;
            }
            .btn-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-primary text-white p-6 text-center">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold">五子棋</h1>
            <p class="text-secondary mt-2">经典对弈游戏</p>
        </div>

        <div class="p-6 md:p-8 flex flex-col md:flex-row gap-6">
            <!-- 游戏区域 -->
            <div class="flex-1 relative">
                <!-- 棋盘：尺寸完全由 canvas 自身决定（DPR 自适应），不再被 CSS 拉伸 -->
                <div id="boardWrap" class="relative aspect-square rounded-xl shadow-lg overflow-hidden bg-board">
                    <canvas id="gameCanvas" class="block w-full h-full cursor-pointer touch-none select-none"></canvas>

                    <!-- 联机状态遮罩：等待对手 / 对手离线 / 选择匹配方式 -->
                    <div id="boardOverlay" class="absolute inset-0 items-center justify-center bg-black/50 text-white text-center p-4" style="display:none">
                        <div>
                            <i id="overlayIcon" class="fa-solid fa-hourglass-half text-3xl mb-3"></i>
                            <p id="overlayTitle" class="font-semibold">等待对手加入…</p>
                            <p id="overlayDesc" class="text-xs text-white/85 mt-1">把房间号告诉朋友，或直接分享链接</p>
                            <div id="overlayCode" class="font-mono text-3xl font-bold tracking-[0.35em] mt-3">----</div>
                            <button id="overlayCopy" class="hidden mt-4 bg-white/90 hover:bg-white text-gray-800 text-sm px-4 py-2 rounded-lg font-medium">
                                <i class="fa-solid fa-link mr-1"></i>复制邀请链接
                            </button>
                        </div>
                    </div>
                </div>

                <div id="gameStatus" class="mt-4 p-3 bg-secondary/20 rounded-lg text-center">
                    <p id="statusText" class="font-medium">游戏开始! 黑棋先行</p>
                </div>
            </div>

            <!-- 游戏控制和信息 -->
            <div class="w-full md:w-80 flex flex-col gap-6">
                <div class="bg-gray-50 rounded-lg p-5 shadow-sm">
                    <h2 class="text-lg font-semibold mb-3 flex items-center">
                        <i class="fa-solid fa-info-circle mr-2 text-primary"></i>游戏信息
                    </h2>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-gray-600">当前回合</span>
                            <div class="flex items-center">
                                <div id="currentPlayer" class="w-6 h-6 rounded-full bg-black mr-2"></div>
                                <span id="playerText">黑棋</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-gray-600">游戏时间</span>
                            <span id="gameTime" class="font-mono">00:00</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-gray-600">步数</span>
                            <span id="moveCount">0</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-gray-600">游戏模式</span>
                            <span id="gameMode">人机对战</span>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-lg p-5 shadow-sm">
                    <h2 class="text-lg font-semibold mb-3 flex items-center">
                        <i class="fa-solid fa-crown mr-2 text-primary"></i>游戏规则
                    </h2>
                    <ul class="text-sm text-gray-600 space-y-2">
                        <li class="flex items-start">
                            <i class="fa-solid fa-circle text-xs mt-1.5 mr-2 text-primary"></i>
                            <span>黑棋和白棋轮流在棋盘上落子</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa-solid fa-circle text-xs mt-1.5 mr-2 text-primary"></i>
                            <span>先在横、竖或斜方向形成五子连线者获胜</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa-solid fa-circle text-xs mt-1.5 mr-2 text-primary"></i>
                            <span>点击棋盘上的交叉点放置棋子</span>
                        </li>
                    </ul>
                </div>

                <div class="flex gap-3">
                    <button id="restartBtn" class="flex-1 bg-primary hover:bg-primary/90 text-white py-3 px-4 rounded-lg font-medium btn-hover flex items-center justify-center">
                        <i class="fa-solid fa-refresh mr-2"></i>重新开始
                    </button>
                    <button id="undoBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 px-4 rounded-lg font-medium btn-hover flex items-center justify-center">
                        <i class="fa-solid fa-undo mr-2"></i>悔棋
                    </button>
                </div>

                <div class="bg-gray-50 rounded-lg p-5 shadow-sm">
                    <h2 class="text-lg font-semibold mb-3 flex items-center">
                        <i class="fa-solid fa-sliders mr-2 text-primary"></i>游戏设置
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">选择对手</label>
                            <div class="flex space-x-2">
                                <button id="humanBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-3 rounded-lg font-medium btn-hover text-sm">
                                    人类
                                </button>
                                <button id="aiBtn" class="flex-1 bg-primary/80 hover:bg-primary text-white py-2 px-3 rounded-lg font-medium btn-hover text-sm">
                                    AI
                                </button>
                                <button id="onlineBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-3 rounded-lg font-medium btn-hover text-sm">
                                    联机
                                </button>
                            </div>
                        </div>

                        <div id="aiDifficultyRow">
                            <label class="block text-sm font-medium text-gray-700 mb-2">AI难度</label>
                            <select id="aiDifficulty" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <option value="easy">简单</option>
                                <option value="medium" selected>中等</option>
                                <option value="hard">困难</option>
                            </select>
                        </div>

                        <!-- 联机面板（仅「联机」模式显示） -->
                        <div id="onlinePanel" style="display:none" class="space-y-3">
                            <div id="onlineLobby">
                                <div class="flex items-center justify-between text-xs text-gray-500 mb-2">
                                    <span>在线情况</span>
                                    <span id="lobbyStats" class="font-mono">—</span>
                                </div>
                                <button id="quickBtn" class="w-full bg-primary hover:bg-primary/90 text-white py-2.5 px-4 rounded-lg font-medium btn-hover text-sm mb-2">
                                    <i class="fa-solid fa-bolt mr-2"></i>快速匹配
                                </button>
                                <button id="createRoomBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 px-4 rounded-lg font-medium btn-hover text-sm mb-3">
                                    <i class="fa-solid fa-plus mr-2"></i>创建房间（拿邀请链接）
                                </button>
                                <div class="flex gap-2">
                                    <input id="roomInput" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="房间号" class="flex-1 w-0 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                    <button id="joinRoomBtn" class="bg-primary/80 hover:bg-primary text-white px-4 rounded-md font-medium btn-hover">加入</button>
                                </div>
                                <div id="roomListWrap" class="mt-3" style="display:none">
                                    <p class="text-xs text-gray-500 mb-1">等待中的房间（点一下加入）</p>
                                    <div id="roomList" class="flex flex-wrap gap-1.5 max-h-24 overflow-auto"></div>
                                </div>
                                <p id="onlineHint" class="text-xs text-gray-500 mt-2 leading-relaxed"></p>
                            </div>

                            <div id="onlineRoom" style="display:none">
                                <div class="flex items-center justify-between">
                                    <span class="text-sm text-gray-600">房间号</span>
                                    <span id="roomCode" class="font-mono text-xl font-bold text-primary tracking-[0.25em]">----</span>
                                </div>
                                <div class="mt-2 flex items-center justify-between text-sm">
                                    <span class="text-gray-600">我执</span>
                                    <span id="myColor" class="font-medium flex items-center gap-2">
                                        <span id="myColorDot" class="inline-block w-4 h-4 rounded-full bg-black"></span>
                                        <span id="myColorText">黑棋</span>
                                    </span>
                                </div>
                                <div class="mt-1 flex items-center justify-between text-sm">
                                    <span class="text-gray-600">对手</span>
                                    <span id="oppStatus" class="font-medium text-gray-500">—</span>
                                </div>
                                <div class="mt-3 flex gap-2">
                                    <button id="copyLinkBtn" class="flex-1 bg-primary/80 hover:bg-primary text-white py-2 rounded-lg text-sm font-medium btn-hover">
                                        <i class="fa-solid fa-link mr-1"></i>邀请链接
                                    </button>
                                    <button id="leaveBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 rounded-lg text-sm font-medium btn-hover">
                                        <i class="fa-solid fa-right-from-bracket mr-1"></i>退出
                                    </button>
                                </div>
                                <p id="roomHint" class="text-xs text-gray-500 mt-2 leading-relaxed"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 p-4 text-center text-sm text-gray-500">
            <p>© 2025 五子棋游戏 | 一个简单的 Web 游戏</p>
        </div>
    </div>

    <!-- 胜利提示模态框 -->
    <div id="winModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4 transform transition-transform duration-300 scale-95">
            <div class="text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-trophy text-3xl text-yellow-500"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2" id="winnerText">黑棋获胜!</h2>
                <p class="text-gray-600 mb-6">期待您下次的精彩表现!</p>
                <button id="newGameBtn" class="bg-primary hover:bg-primary/90 text-white py-3 px-8 rounded-lg font-medium btn-hover">
                    开始新游戏
                </button>
            </div>
        </div>
    </div>

    <!-- 对手请求确认（悔棋 / 重开需双方同意） -->
    <div id="reqModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[55] hidden">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <div class="text-center">
                <div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i id="reqIcon" class="fa-solid fa-rotate-left text-2xl text-amber-600"></i>
                </div>
                <h3 id="reqTitle" class="text-lg font-bold mb-2">对手请求悔棋</h3>
                <p id="reqDesc" class="text-sm text-gray-600 mb-5">同意后棋盘会回退到对手上一步之前。</p>
                <div class="flex gap-3">
                    <button id="reqReject" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded-lg font-medium btn-hover">拒绝</button>
                    <button id="reqAccept" class="flex-1 bg-primary hover:bg-primary/90 text-white py-2.5 rounded-lg font-medium btn-hover">同意</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 轻提示 -->
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-8 z-[60] pointer-events-none" style="display:none">
        <div id="toastBody" class="bg-gray-900/90 text-white text-sm px-4 py-2 rounded-lg shadow-lg"></div>
    </div>

    <script>
        /* 联机服务地址：
           - 同源部署时留空字符串即可（本页面由联机服务托管时走这条，先探测 /api/ping）
           - 静态托管（如 GitHub Pages）跨域调用时，填联机服务的绝对地址
           页面会自动探测：同源能通就用同源，否则回退到下面这个地址。 */
        const ONLINE_FALLBACK = 'https://gomoku-online-53041.app.workbuddy.host';
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* ============================================================
             *  1. 常量与状态
             * ============================================================ */
            const BOARD_SIZE = 15;                 // 15 x 15 交叉点
            const STAR_POINTS = [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]]; // [row, col]
            const EDGE_PAD_RATIO = 0.72;           // 棋盘外留白 = 0.72 个格子（避免边线棋子被裁切）

            let gameBoard = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            let currentPlayer = 1;                 // 1: 黑棋, 2: 白棋
            let gameActive = true;
            let moveHistory = [];
            let gameTime = 0;
            let timerInterval;
            let aiTimer = null;
            let isAgainstAI = true;
            let aiDifficulty = 'medium';
            let aiPlayer = 2;

            let lastMove = null;                   // { row, col } 最近一步，用于落点标记
            let winCells = null;                   // 获胜的连子坐标数组
            let hoverCell = null;                  // 鼠标悬停的交叉点

            /* ---------------- 渲染相关的布局变量（全部为 CSS 像素） ---------------- */
            let dprValue = 1;
            let cssSize = 0;                       // 棋盘边长（CSS px）
            let cell = 30;                         // 格子间距
            let origin = 22;                       // 首条线的偏移
            let lineW = 1.5;                       // 网格线宽

            /* ============================================================
             *  2. DOM
             * ============================================================ */
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const boardWrap = document.getElementById('boardWrap');
            const statusText = document.getElementById('statusText');
            const currentPlayerEl = document.getElementById('currentPlayer');
            const playerText = document.getElementById('playerText');
            const moveCountEl = document.getElementById('moveCount');
            const gameTimeEl = document.getElementById('gameTime');
            const gameModeEl = document.getElementById('gameMode');
            const restartBtn = document.getElementById('restartBtn');
            const undoBtn = document.getElementById('undoBtn');
            const winModal = document.getElementById('winModal');
            const winnerText = document.getElementById('winnerText');
            const newGameBtn = document.getElementById('newGameBtn');
            const humanBtn = document.getElementById('humanBtn');
            const aiBtn = document.getElementById('aiBtn');
            const aiDifficultyEl = document.getElementById('aiDifficulty');

            /* ---------------- 联机相关 DOM ---------------- */
            const onlineBtn = document.getElementById('onlineBtn');
            const aiDifficultyRow = document.getElementById('aiDifficultyRow');
            const onlinePanel = document.getElementById('onlinePanel');
            const onlineLobby = document.getElementById('onlineLobby');
            const onlineRoom = document.getElementById('onlineRoom');
            const lobbyStatsEl = document.getElementById('lobbyStats');
            const quickBtn = document.getElementById('quickBtn');
            const createRoomBtn = document.getElementById('createRoomBtn');
            const joinRoomBtn = document.getElementById('joinRoomBtn');
            const roomInput = document.getElementById('roomInput');
            const roomListWrap = document.getElementById('roomListWrap');
            const roomListEl = document.getElementById('roomList');
            const roomCodeEl = document.getElementById('roomCode');
            const myColorDot = document.getElementById('myColorDot');
            const myColorText = document.getElementById('myColorText');
            const oppStatusEl = document.getElementById('oppStatus');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const leaveBtn = document.getElementById('leaveBtn');
            const roomHintEl = document.getElementById('roomHint');
            const boardOverlay = document.getElementById('boardOverlay');
            const overlayIcon = document.getElementById('overlayIcon');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlayDesc = document.getElementById('overlayDesc');
            const overlayCode = document.getElementById('overlayCode');
            const overlayCopy = document.getElementById('overlayCopy');
            const reqModal = document.getElementById('reqModal');
            const reqIcon = document.getElementById('reqIcon');
            const reqTitle = document.getElementById('reqTitle');
            const reqDesc = document.getElementById('reqDesc');
            const reqAccept = document.getElementById('reqAccept');
            const reqReject = document.getElementById('reqReject');
            const toastEl = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');

            /* ============================================================
             *  联机层：HTTP 轮询 + version 版本号
             *  为什么不用 WebSocket：单端口反向代理环境下轮询最稳，
             *  且棋类回合制对延迟不敏感（900ms 一次，无变化时响应体仅几十字节）
             * ============================================================ */
            const POLL_ACTIVE_MS = 900;    // 页面可见时的轮询间隔
            const POLL_HIDDEN_MS = 3000;   // 切到后台时降频
            const LOBBY_POLL_MS = 3000;    // 大厅在线人数刷新

            let apiBase = null;      // null=未探测；''=同源；其它=绝对地址
            let pollTimer = null;
            let lobbyTimer = null;
            let toastTimer = null;

            const net = {
                active: false,       // 是否处于联机模式
                roomId: null,
                token: null,
                color: 0,
                version: -1,
                status: 'idle',      // idle | waiting | playing | finished
                moveCount: 0,
                oppJoined: false,
                oppOnline: false,
                pending: null,
                rematch: [],
                shownResultKey: null,
                busy: false,
                movePending: false,
            };

            function onlineActive() { return net.active; }

            function toast(msg, ms) {
                toastBody.textContent = msg;
                toastEl.style.display = 'block';
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, ms || 2200);
            }

            // 先探测同源是否就是联机服务；不是则回退到 ONLINE_FALLBACK
            async function resolveApiBase() {
                if (apiBase !== null) return apiBase;
                try {
                    const ctl = new AbortController();
                    const timer = setTimeout(() => ctl.abort(), 2500);
                    const r = await fetch('/api/ping', { cache: 'no-store', signal: ctl.signal });
                    clearTimeout(timer);
                    if (r.ok) {
                        const j = await r.json();
                        if (j && j.ok) { apiBase = ''; return apiBase; }
                    }
                } catch (e) { /* 同源没有联机服务 */ }
                apiBase = ONLINE_FALLBACK || '';
                return apiBase;
            }

            async function netFetch(pathname, opts) {
                const base = await resolveApiBase();
                const init = { cache: 'no-store', method: (opts && opts.method) || 'GET', headers: {} };
                if (opts && opts.body) {
                    init.headers['Content-Type'] = 'application/json';
                    init.body = JSON.stringify(opts.body);
                }
                const res = await fetch(base + pathname, init);
                let data = null;
                try { data = await res.json(); } catch (e) { data = null; }
                if (!res.ok) {
                    const err = new Error((data && data.message) || ('联机请求失败 (' + res.status + ')'));
                    err.code = data && data.error;
                    err.status = res.status;
                    throw err;
                }
                return data;
            }

            function clearBoard() {
                gameBoard = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
                currentPlayer = 1;
                moveHistory = [];
                lastMove = null;
                winCells = null;
                hoverCell = null;
                drawBoard();
            }

            /* ---------------- 棋盘遮罩 ---------------- */
            function showOverlay(kind, title, desc, code) {
                boardOverlay.style.display = 'flex';
                overlayIcon.className = kind === 'wait'
                    ? 'fa-solid fa-hourglass-half text-3xl mb-3 animate-pulse'
                    : kind === 'offline'
                        ? 'fa-solid fa-plug-circle-xmark text-3xl mb-3'
                        : 'fa-solid fa-globe text-3xl mb-3';
                overlayTitle.textContent = title;
                overlayDesc.textContent = desc || '';
                overlayCode.textContent = code || '';
                overlayCopy.classList.toggle('hidden', !code);
            }
            function hideOverlay() { boardOverlay.style.display = 'none'; }

            function updateOverlay() {
                if (!net.active) { hideOverlay(); return; }
                if (!net.roomId) {
                    showOverlay('idle', '联机对战', '点「快速匹配」随机找对手，或创建房间把链接发给朋友', '');
                    return;
                }
                if (!net.oppJoined) {
                    showOverlay('wait', '等待对手加入…', '把房间号告诉朋友，或直接分享邀请链接', net.roomId);
                    return;
                }
                if (!net.oppOnline && net.status === 'playing') {
                    showOverlay('offline', '对手已离线', '等待对方重新连接…', '');
                    return;
                }
                hideOverlay();
            }

            /* ---------------- 侧栏面板 ---------------- */
            function renderOnlinePanel() {
                if (!net.active) return;
                const inRoom = !!net.roomId;
                onlineLobby.style.display = inRoom ? 'none' : 'block';
                onlineRoom.style.display = inRoom ? 'block' : 'none';
                if (!inRoom) return;

                roomCodeEl.textContent = net.roomId;

                const isBlack = net.color === 1;
                myColorDot.className = 'inline-block w-4 h-4 rounded-full ' + (isBlack ? 'bg-black' : 'bg-white border border-gray-400');
                myColorText.textContent = isBlack ? '黑棋' : '白棋';

                if (!net.oppJoined) {
                    oppStatusEl.textContent = '等待加入…';
                    oppStatusEl.className = 'font-medium text-gray-500';
                } else if (net.oppOnline) {
                    oppStatusEl.textContent = '在线';
                    oppStatusEl.className = 'font-medium text-green-600';
                } else {
                    oppStatusEl.textContent = '已离线';
                    oppStatusEl.className = 'font-medium text-red-500';
                }

                if (net.status === 'playing') {
                    roomHintEl.textContent = currentPlayer === net.color
                        ? '轮到你落子。悔棋 / 重开需要对方同意。'
                        : '等待对手落子…';
                } else if (net.status === 'finished') {
                    roomHintEl.textContent = '对局结束。双方都点「再来一局」才会重开（会交换先手）。';
                } else {
                    roomHintEl.textContent = '对手已离开，等待新玩家接管空位。';
                }
            }

            /* ---------------- 对手请求确认弹窗 ---------------- */
            function syncRequestModal() {
                if (!net.active) { reqModal.classList.add('hidden'); return; }
                const p = net.pending;
                if (p && p.by !== net.color) {
                    const isUndo = p.type === 'undo-request';
                    reqIcon.className = 'fa-solid ' + (isUndo ? 'fa-rotate-left' : 'fa-arrows-rotate') + ' text-2xl text-amber-600';
                    reqTitle.textContent = isUndo ? '对手请求悔棋' : '对手请求重开';
                    reqDesc.textContent = isUndo
                        ? '同意后棋盘会回退到对手上一步之前。'
                        : '同意后棋盘会清空，重新开局。';
                    reqModal.classList.remove('hidden');
                } else {
                    reqModal.classList.add('hidden');
                }
            }

            /* ---------------- 轮询 ---------------- */
            function schedulePoll(delay) {
                clearTimeout(pollTimer);
                pollTimer = setTimeout(pollOnce, delay);
            }
            function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }

            async function pollOnce() {
                pollTimer = null;
                if (!net.active || !net.roomId) return;
                try {
                    const q = '?roomId=' + encodeURIComponent(net.roomId) +
                              '&token=' + encodeURIComponent(net.token) +
                              '&since=' + net.version;
                    const data = await netFetch('/api/state' + q);
                    if (data) {
                        if (data.unchanged === false && data.state) applyRemoteState(data.state);
                        else if (typeof data.version === 'number') net.version = data.version;
                    }
                } catch (e) {
                    handleRoomError(e);
                } finally {
                    if (net.active && net.roomId) {
                        schedulePoll(document.hidden ? POLL_HIDDEN_MS : POLL_ACTIVE_MS);
                    }
                }
            }

            function startLobbyPolling() {
                stopLobbyPolling();
                lobbyTimer = setInterval(lobbyTick, LOBBY_POLL_MS);
            }
            function stopLobbyPolling() { clearInterval(lobbyTimer); lobbyTimer = null; }

            async function lobbyTick() {
                if (!net.active || net.roomId) return;
                try {
                    const data = await netFetch('/api/lobby');
                    lobbyStatsEl.textContent = '在线 ' + data.online + ' · 等待 ' + data.waiting + ' · 对局 ' + data.playing;
                    renderRoomList((data.list || []).filter(r => r.status === 'waiting' && r.players === 1 && r.online >= 1));
                } catch (e) {
                    lobbyStatsEl.textContent = '联机服务不可用';
                    roomListWrap.style.display = 'none';
                }
            }

            function renderRoomList(list) {
                roomListEl.textContent = '';
                if (!list.length) { roomListWrap.style.display = 'none'; return; }
                roomListWrap.style.display = 'block';
                list.forEach(r => {
                    const b = document.createElement('button');
                    b.className = 'px-3 py-1.5 rounded-md bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-mono btn-hover';
                    b.textContent = r.id;
                    b.title = '已等待 ' + r.age + ' 秒';
                    b.addEventListener('click', () => netJoin(r.id));
                    roomListEl.appendChild(b);
                });
            }

            /* ---------------- 应用服务端状态 ---------------- */
            function applyRemoteState(st) {
                if (!st) return;
                net.roomId = st.roomId || net.roomId;
                net.color = st.yourColor || net.color;
                net.version = st.version;
                net.status = st.status;
                net.moveCount = st.moveCount || 0;
                net.pending = st.pending || null;
                net.rematch = st.rematch || [];

                const opp = (st.players || []).find(p => p.color !== net.color);
                net.oppJoined = !!(opp && opp.joined);
                net.oppOnline = !!(opp && opp.online);

                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        gameBoard[i][j] = Number(st.board[i * BOARD_SIZE + j]) || 0;
                    }
                }
                currentPlayer = st.turn;
                lastMove = st.lastMove || null;
                winCells = (st.winCells && st.winCells.length) ? st.winCells : null;
                hoverCell = null;
                gameActive = (st.status === 'playing' && net.oppJoined);
                if (!timerInterval) startTimer();

                drawBoard();
                updateGameStatus();
                renderOnlinePanel();
                syncRequestModal();
                updateOverlay();

                if (st.status === 'finished') {
                    const key = net.version + '-' + (st.winner || 0) + '-' + (st.draw ? 'd' : '');
                    if (net.shownResultKey !== key) {
                        net.shownResultKey = key;
                        showWinModal(st.draw ? 0 : st.winner);
                    }
                } else {
                    net.shownResultKey = null;
                }
            }

            /* ---------------- 进出房间 ---------------- */
            function enterRoom(d) {
                net.roomId = d.roomId;
                net.token = d.token;
                net.color = d.color;
                net.version = -1;
                net.shownResultKey = null;
                net.busy = false;
                try { localStorage.setItem('gomoku.room.' + d.roomId, d.token); } catch (e) {}
                stopLobbyPolling();
                updateQueryRoom(d.roomId);
                applyRemoteState(d.state);
                schedulePoll(80);
            }

            async function netCreate() {
                await withBusy(async () => {
                    const d = await netFetch('/api/create', { method: 'POST', body: {} });
                    enterRoom(d);
                    toast('房间已创建，把邀请链接发给朋友吧', 3000);
                });
            }

            async function netQuick() {
                await withBusy(async () => {
                    const d = await netFetch('/api/quick', { method: 'POST', body: {} });
                    enterRoom(d);
                    if (d.matched) toast('匹配成功，对手已就位');
                    else toast('暂时没人在等，房间已开好，把链接发给朋友吧', 3400);
                });
            }

            async function netJoin(code) {
                const id = String(code == null ? '' : code).trim();
                if (!/^\d{3,5}$/.test(id)) { toast('请输入房间号（4 位数字）'); return; }
                await withBusy(async () => {
                    const d = await netFetch('/api/join', { method: 'POST', body: { roomId: id } });
                    enterRoom(d);
                    toast('已加入房间 ' + id);
                });
            }

            async function withBusy(fn) {
                if (net.busy) return;
                net.busy = true;
                try { await fn(); }
                catch (e) { handleRoomError(e); }
                finally { net.busy = false; }
            }

            async function netLeave(silent) {
                const roomId = net.roomId;
                const token = net.token;

                net.roomId = null;
                net.token = null;
                net.color = 0;
                net.version = -1;
                net.status = 'idle';
                net.moveCount = 0;
                net.oppJoined = false;
                net.oppOnline = false;
                net.pending = null;
                net.rematch = [];
                net.shownResultKey = null;
                stopPolling();

                if (roomId && token) {
                    try { await netFetch('/api/leave', { method: 'POST', body: { roomId, token } }); } catch (e) {}
                    try { localStorage.removeItem('gomoku.room.' + roomId); } catch (e) {}
                }
                updateQueryRoom(null);

                if (!silent) {
                    clearBoard();
                    gameActive = false;
                    hideWinModal();
                    reqModal.classList.add('hidden');
                    updateGameStatus();
                    renderOnlinePanel();
                    updateOverlay();
                }
                if (net.active) { startLobbyPolling(); lobbyTick(); }
            }

            function enterOnlineLobby() {
                net.active = true;
                net.roomId = null;
                net.token = null;
                net.color = 0;
                net.version = -1;
                net.status = 'idle';
                net.moveCount = 0;
                net.oppJoined = false;
                net.oppOnline = false;
                net.pending = null;
                net.rematch = [];
                net.shownResultKey = null;
                net.busy = false;
                net.movePending = false;

                clearTimeout(aiTimer);
                aiTimer = null;
                stopPolling();
                gameTime = 0;
                gameTimeEl.textContent = '00:00';
                stopTimer();
                startTimer();

                clearBoard();
                gameActive = false;
                hideWinModal();
                reqModal.classList.add('hidden');
                updateGameStatus();
                renderOnlinePanel();
                updateOverlay();
                startLobbyPolling();
                lobbyTick();
            }

            async function netMove(row, col) {
                try {
                    const d = await netFetch('/api/move', {
                        method: 'POST',
                        body: { roomId: net.roomId, token: net.token, row: row, col: col }
                    });
                    if (d && d.state) applyRemoteState(d.state);
                } catch (e) {
                    if (e.code === 'not_your_turn' || e.code === 'occupied') {
                        toast(e.message);
                        pollOnce();
                    } else {
                        handleRoomError(e);
                    }
                }
            }

            async function netAction(type) {
                try {
                    const d = await netFetch('/api/action', {
                        method: 'POST',
                        body: { roomId: net.roomId, token: net.token, type: type }
                    });
                    if (d && d.state) applyRemoteState(d.state);
                } catch (e) {
                    toast(e.message);
                    if (e.code !== 'pending_exists' && e.code !== 'no_pending' &&
                        e.code !== 'nothing_to_undo' && e.code !== 'not_playing' &&
                        e.code !== 'not_finished') {
                        handleRoomError(e);
                    }
                }
            }

            function handleRoomError(e) {
                if (!e) return;
                if (e.code === 'seat_lost' || e.code === 'room_not_found' || e.status === 401 || e.status === 404) {
                    toast('房间已失效，已回到大厅');
                    netLeave(true);
                    if (net.active) {
                        updateGameStatus();
                        renderOnlinePanel();
                        updateOverlay();
                        startLobbyPolling();
                        lobbyTick();
                    }
                    return;
                }
                toast(e.message || '联机出错，请重试');
            }

            /* ---------------- 邀请链接 ---------------- */
            function inviteLink() {
                if (!net.roomId) return '';
                const u = new URL(location.href);
                u.searchParams.set('room', net.roomId);
                u.hash = '';
                return u.toString();
            }

            function updateQueryRoom(id) {
                if (!/^https?:$/.test(location.protocol)) return;
                try {
                    const u = new URL(location.href);
                    if (id) u.searchParams.set('room', id);
                    else u.searchParams.delete('room');
                    history.replaceState(null, '', u.toString());
                } catch (e) {}
            }

            async function copyText(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (e) { /* 降级到 execCommand */ }
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.top = '-1000px';
                    document.body.appendChild(ta);
                    ta.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    return ok;
                } catch (e) { return false; }
            }

            async function copyInviteLink() {
                if (!net.roomId) return;
                const link = inviteLink();
                const ok = await copyText(link);
                if (ok) toast('邀请链接已复制，发给朋友即可');
                else toast('复制失败，请手动复制：' + link, 5000);
            }

            async function autoJoinFromUrl(id) {
                let token = null;
                try { token = localStorage.getItem('gomoku.room.' + id); } catch (e) {}
                if (token) {
                    try {
                        const d = await netFetch('/api/resume', { method: 'POST', body: { roomId: id, token: token } });
                        enterRoom(d);
                        toast('已回到房间 ' + id);
                        return;
                    } catch (e) { /* 座位失效，走重新加入 */ }
                }
                await netJoin(id);
            }

            /* ============================================================
             *  3. 高清渲染核心
             *     关键点：
             *     ① canvas 后备缓冲 = CSS 尺寸 × devicePixelRatio，杜绝浏览器二次拉伸
             *     ② ctx.setTransform(dpr,...) 之后，所有绘制都能用 CSS 像素坐标书写
             *     ③ 线条中心对齐到设备像素边界，1px 网格线不再发虚
             * ============================================================ */
            function toXY(row, col) {
                return [origin + col * cell, origin + row * cell];
            }

            // 把坐标吸附到设备像素网格上，保证描边落在整像素上
            function crisp(v, lw) {
                const dev = Math.round(v * dprValue);
                const devLw = Math.max(1, Math.round(lw * dprValue));
                return (dev + (devLw % 2 ? 0.5 : 0)) / dprValue;
            }

            function resizeCanvas() {
                const rect = boardWrap.getBoundingClientRect();
                const rawW = rect.width || boardWrap.clientWidth || 420;
                const rawH = rect.height || boardWrap.clientHeight || rawW;
                const size = Math.max(160, Math.floor(Math.min(rawW, rawH)));
                const dpr = window.devicePixelRatio || 1;

                dprValue = dpr;
                cssSize = size;

                // 显式给定 CSS 尺寸：canvas 一比一呈现，不再被父容器拉伸
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
                canvas.width = Math.round(size * dpr);
                canvas.height = Math.round(size * dpr);

                // 重新推导几何参数
                const denom = (BOARD_SIZE - 1) + EDGE_PAD_RATIO * 2;
                cell = size / denom;
                origin = cell * EDGE_PAD_RATIO;
                lineW = Math.max(1, Math.min(2, cell * 0.05));

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawBoard();
            }

            /* ---------------- 木纹底色 ---------------- */
            function drawBoardSurface() {
                const g = ctx.createLinearGradient(0, 0, cssSize, cssSize);
                g.addColorStop(0, '#F2D9AC');
                g.addColorStop(0.45, '#E8C78E');
                g.addColorStop(1, '#DCB77A');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, cssSize, cssSize);

                // 左上柔光
                const sheen = ctx.createRadialGradient(
                    cssSize * 0.26, cssSize * 0.18, cssSize * 0.04,
                    cssSize * 0.26, cssSize * 0.18, cssSize * 0.78
                );
                sheen.addColorStop(0, 'rgba(255,255,255,0.34)');
                sheen.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = sheen;
                ctx.fillRect(0, 0, cssSize, cssSize);

                // 右下压暗，做出一点体积感
                const shade = ctx.createRadialGradient(
                    cssSize * 0.82, cssSize * 0.92, cssSize * 0.04,
                    cssSize * 0.82, cssSize * 0.92, cssSize * 0.85
                );
                shade.addColorStop(0, 'rgba(122,82,30,0.20)');
                shade.addColorStop(1, 'rgba(122,82,30,0)');
                ctx.fillStyle = shade;
                ctx.fillRect(0, 0, cssSize, cssSize);
            }

            /* ---------------- 网格线 ---------------- */
            function drawGrid() {
                const a = crisp(origin, lineW);
                const b = crisp(origin + cell * (BOARD_SIZE - 1), lineW);

                ctx.lineCap = 'butt';
                ctx.lineWidth = lineW;
                ctx.strokeStyle = 'rgba(96,56,22,0.82)';

                // 一次路径画完 30 条线，比逐条 stroke 快且抗锯齿更均匀
                ctx.beginPath();
                for (let i = 0; i < BOARD_SIZE; i++) {
                    const p = crisp(origin + i * cell, lineW);
                    ctx.moveTo(a, p);
                    ctx.lineTo(b, p);
                    ctx.moveTo(p, a);
                    ctx.lineTo(p, b);
                }
                ctx.stroke();

                // 外框加重
                const outerW = lineW * 1.7;
                const oa = crisp(origin, outerW);
                const ob = crisp(origin + cell * (BOARD_SIZE - 1), outerW);
                ctx.lineWidth = outerW;
                ctx.strokeStyle = 'rgba(78,44,16,0.92)';
                ctx.strokeRect(oa, oa, ob - oa, ob - oa);
            }

            /* ---------------- 星位 ---------------- */
            function drawStarPoints() {
                const r = Math.max(2, cell * 0.12);
                ctx.fillStyle = 'rgba(58,32,8,0.92)';
                for (const [row, col] of STAR_POINTS) {
                    const [x, y] = toXY(row, col);
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            /* ---------------- 单颗棋子 ---------------- */
            function drawStone(row, col, player, alpha) {
                const [x, y] = toXY(row, col);
                const r = cell * 0.44;
                const isBlack = player === 1;

                if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;

                // 投影（阴影不受变换矩阵影响，需要手动乘 dpr）
                ctx.save();
                ctx.shadowColor = 'rgba(48,26,6,0.42)';
                ctx.shadowBlur = Math.max(3, r * 0.6) * dprValue;
                ctx.shadowOffsetY = Math.max(1.5, r * 0.18) * dprValue;

                const base = ctx.createRadialGradient(
                    x - r * 0.32, y - r * 0.36, r * 0.08,
                    x, y, r * 1.04
                );
                if (isBlack) {
                    base.addColorStop(0, '#8a8a8a');
                    base.addColorStop(0.45, '#2c2c2c');
                    base.addColorStop(1, '#050505');
                } else {
                    base.addColorStop(0, '#ffffff');
                    base.addColorStop(0.55, '#f5f5f5');
                    base.addColorStop(1, '#c0c0c0');
                }
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = base;
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.clip();

                // 内侧边缘光
                ctx.lineWidth = Math.max(1, r * 0.2);
                ctx.strokeStyle = isBlack
                    ? 'rgba(255,255,255,0.14)'
                    : 'rgba(138,138,138,0.55)';
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.stroke();

                // 高光
                const hl = ctx.createRadialGradient(
                    x - r * 0.33, y - r * 0.38, 0,
                    x - r * 0.33, y - r * 0.38, r * 0.68
                );
                hl.addColorStop(0, isBlack ? 'rgba(255,255,255,0.48)' : 'rgba(255,255,255,0.98)');
                hl.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = hl;
                ctx.beginPath();
                ctx.arc(x - r * 0.33, y - r * 0.38, r * 0.68, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.globalAlpha = 1;
            }

            function drawStones() {
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] !== 0) drawStone(i, j, gameBoard[i][j]);
                    }
                }
            }

            /* ---------------- 最近一步标记 ---------------- */
            function drawLastMoveMarker() {
                if (!lastMove) return;
                const [x, y] = toXY(lastMove.row, lastMove.col);
                const r = Math.max(2, cell * 0.12);
                ctx.beginPath();
                ctx.arc(x, y, r + Math.max(1, cell * 0.02), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = '#e5484d';
                ctx.fill();
            }

            /* ---------------- 获胜连线 ---------------- */
            function drawWinLine() {
                if (!winCells || winCells.length < 2) return;
                const [x1, y1] = toXY(winCells[0][0], winCells[0][1]);
                const [x2, y2] = toXY(winCells[winCells.length - 1][0], winCells[winCells.length - 1][1]);

                ctx.save();
                ctx.lineCap = 'round';
                ctx.strokeStyle = 'rgba(229,72,77,0.9)';
                ctx.lineWidth = Math.max(2, cell * 0.14);
                ctx.shadowColor = 'rgba(229,72,77,0.8)';
                ctx.shadowBlur = cell * 0.55 * dprValue;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.restore();
            }

            /* ---------------- 悬停预览 ---------------- */
            function drawHover() {
                if (!hoverCell || !gameActive) return;
                const { row, col } = hoverCell;
                if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
                if (gameBoard[row][col] !== 0) return;

                const [x, y] = toXY(row, col);
                const r = cell * 0.44;
                const a = crisp(origin, lineW);
                const b = crisp(origin + cell * (BOARD_SIZE - 1), lineW);

                // 十字辅助线
                ctx.save();
                ctx.globalAlpha = 0.22;
                ctx.lineWidth = lineW;
                ctx.strokeStyle = '#8B4513';
                ctx.beginPath();
                ctx.moveTo(a, crisp(y, lineW));
                ctx.lineTo(b, crisp(y, lineW));
                ctx.moveTo(crisp(x, lineW), a);
                ctx.lineTo(crisp(x, lineW), b);
                ctx.stroke();
                ctx.restore();

                // 幽灵棋子
                ctx.save();
                const isBlack = currentPlayer === 1;
                const g = ctx.createRadialGradient(
                    x - r * 0.32, y - r * 0.36, r * 0.08,
                    x, y, r * 1.04
                );
                if (isBlack) {
                    g.addColorStop(0, 'rgba(90,90,90,0.55)');
                    g.addColorStop(1, 'rgba(0,0,0,0.38)');
                } else {
                    g.addColorStop(0, 'rgba(255,255,255,0.85)');
                    g.addColorStop(1, 'rgba(210,210,210,0.55)');
                }
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();
                ctx.lineWidth = Math.max(1, cell * 0.05);
                ctx.strokeStyle = isBlack ? 'rgba(0,0,0,0.45)' : 'rgba(150,150,150,0.7)';
                ctx.stroke();
                ctx.restore();
            }

            /* ---------------- 总绘制入口 ---------------- */
            function drawBoard() {
                if (!cssSize) return;
                ctx.clearRect(0, 0, cssSize, cssSize);
                drawBoardSurface();
                drawGrid();
                drawStarPoints();
                drawStones();
                drawLastMoveMarker();
                drawHover();
                drawWinLine();
            }

            let rafId = null;
            function requestDraw() {
                if (rafId !== null) return;
                rafId = requestAnimationFrame(() => {
                    rafId = null;
                    drawBoard();
                });
            }

            /* ============================================================
             *  4. 游戏逻辑
             * ============================================================ */
            function findWin(row, col, player) {
                const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]]; // [dr, dc]
                for (const [dr, dc] of dirs) {
                    const cells = [[row, col]];
                    for (let s = 1; s < 5; s++) {
                        const r = row + dr * s, c = col + dc * s;
                        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) break;
                        if (gameBoard[r][c] !== player) break;
                        cells.push([r, c]);
                    }
                    for (let s = 1; s < 5; s++) {
                        const r = row - dr * s, c = col - dc * s;
                        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) break;
                        if (gameBoard[r][c] !== player) break;
                        cells.unshift([r, c]);
                    }
                    if (cells.length >= 5) return cells;
                }
                return null;
            }

            function checkDraw() {
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] === 0) return false;
                    }
                }
                return true;
            }

            function onlineStatusText() {
                if (!net.roomId) return '联机模式 - 快速匹配，或创建房间邀请好友';
                if (!net.oppJoined) return `等待对手加入房间 ${net.roomId}…`;
                if (net.status === 'finished') return '游戏结束';
                if (!net.oppOnline) return '对手已离线，等待重连…';
                if (net.pending && net.pending.by === net.color) {
                    return net.pending.type === 'undo-request'
                        ? '已请求悔棋，等待对方同意…'
                        : '已请求重开，等待对方同意…';
                }
                return currentPlayer === net.color ? '轮到你落子' : '等待对手落子…';
            }

            function updateGameStatus() {
                if (net.active) {
                    statusText.textContent = onlineStatusText();
                    const isBlack = currentPlayer === 1;
                    currentPlayerEl.className = `w-6 h-6 rounded-full ${isBlack ? 'bg-black' : 'bg-white border border-gray-300'} mr-2 piece-shadow`;
                    playerText.textContent = net.roomId
                        ? (currentPlayer === net.color ? '我' : '对手')
                        : (isBlack ? '黑棋' : '白棋');
                    moveCountEl.textContent = net.moveCount;
                    gameModeEl.textContent = '联机对战';
                    return;
                }

                if (gameActive) {
                    statusText.textContent = `游戏进行中 - ${currentPlayer === 1 ? '黑棋' : (isAgainstAI ? 'AI' : '白棋')}回合`;
                    currentPlayerEl.className = `w-6 h-6 rounded-full ${currentPlayer === 1 ? 'bg-black' : 'bg-white border border-gray-300'} mr-2 piece-shadow`;
                    playerText.textContent = currentPlayer === 1 ? '黑棋' : (isAgainstAI ? 'AI' : '白棋');
                }
                moveCountEl.textContent = moveHistory.length;
                gameModeEl.textContent = isAgainstAI ? '人机对战' : '双人对战';
            }

            function updateGameTime() {
                gameTime++;
                const minutes = Math.floor(gameTime / 60).toString().padStart(2, '0');
                const seconds = (gameTime % 60).toString().padStart(2, '0');
                gameTimeEl.textContent = `${minutes}:${seconds}`;
            }

            function startTimer() {
                clearInterval(timerInterval);
                timerInterval = setInterval(updateGameTime, 1000);
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            function showWinModal(winner) {
                gameActive = false;
                if (!net.active) {
                    stopTimer();
                    clearTimeout(aiTimer);
                    aiTimer = null;
                }

                let text;
                if (net.active) {
                    text = !winner ? '平局' : (winner === net.color ? '你赢了!' : '你输了');
                } else {
                    const winnerName = winner === 1 ? '黑棋' : (isAgainstAI && winner === aiPlayer ? 'AI' : '白棋');
                    text = winnerName + '获胜!';
                }

                winnerText.textContent = text;
                statusText.textContent = '游戏结束 - ' + text;
                newGameBtn.textContent = net.active ? '再来一局' : '开始新游戏';

                const subtitle = winModal.querySelector('.text-gray-600');
                if (subtitle) {
                    subtitle.textContent = net.active
                        ? (!winner
                            ? '棋盘下满了。点「再来一局」开始下一盘（会交换先手）。'
                            : (winner === net.color
                                ? '点「再来一局」开始下一盘（会交换先手）。'
                                : '点「再来一局」向对手发出续局邀请。'))
                        : '期待您下次的精彩表现!';
                }

                winModal.classList.remove('hidden');

                setTimeout(() => {
                    winModal.classList.add('opacity-100');
                    const card = winModal.firstElementChild;
                    card.classList.remove('scale-95');
                    card.classList.add('scale-100');
                }, 10);
                requestDraw();
            }

            function hideWinModal() {
                winModal.classList.remove('opacity-100');
                const card = winModal.firstElementChild;
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
                setTimeout(() => winModal.classList.add('hidden'), 300);
            }

            function endWithDraw() {
                gameActive = false;
                stopTimer();
                clearTimeout(aiTimer);
                aiTimer = null;
                statusText.textContent = '游戏结束 - 平局!';
                requestDraw();
            }

            function resetGame() {
                clearTimeout(aiTimer);
                aiTimer = null;

                gameBoard = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
                currentPlayer = 1;
                gameActive = true;
                moveHistory = [];
                gameTime = 0;
                lastMove = null;
                winCells = null;
                hoverCell = null;

                drawBoard();
                updateGameStatus();
                gameTimeEl.textContent = '00:00';

                stopTimer();
                startTimer();
                hideWinModal();

                if (isAgainstAI && aiPlayer === 1) scheduleAIMove();
            }

            function undoMove() {
                if (!gameActive || moveHistory.length === 0) return;
                clearTimeout(aiTimer);
                aiTimer = null;

                if (isAgainstAI) {
                    // 若 AI 已落子，先撤销 AI 这一步
                    if (currentPlayer === aiPlayer && moveHistory.length > 0) {
                        const m = moveHistory.pop();
                        gameBoard[m.row][m.col] = 0;
                    }
                    // 再撤销玩家这一步
                    if (moveHistory.length > 0) {
                        const m = moveHistory.pop();
                        gameBoard[m.row][m.col] = 0;
                    }
                    currentPlayer = 1;
                } else {
                    const m = moveHistory.pop();
                    gameBoard[m.row][m.col] = 0;
                    currentPlayer = m.player;
                }

                const last = moveHistory[moveHistory.length - 1];
                lastMove = last ? { row: last.row, col: last.col } : null;
                winCells = null;

                drawBoard();
                updateGameStatus();
            }

            /* ---------------- 单点评估（沿用原评分口径） ---------------- */
            function evaluatePosition(row, col, player) {
                if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE || gameBoard[row][col] !== 0) {
                    return -Infinity;
                }

                gameBoard[row][col] = player;
                let score = 0;

                const directions = [
                    [1, 0],
                    [0, 1],
                    [1, 1],
                    [1, -1]
                ];

                for (const [dx, dy] of directions) {
                    let count = 1;
                    let blocked = 0;

                    for (let i = 1; i < 5; i++) {
                        const newRow = row + i * dy;
                        const newCol = col + i * dx;

                        if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE) {
                            blocked++;
                            break;
                        }
                        if (gameBoard[newRow][newCol] === player) {
                            count++;
                        } else if (gameBoard[newRow][newCol] !== 0) {
                            blocked++;
                            break;
                        } else {
                            break;
                        }
                    }

                    for (let i = 1; i < 5; i++) {
                        const newRow = row - i * dy;
                        const newCol = col - i * dx;

                        if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE) {
                            blocked++;
                            break;
                        }
                        if (gameBoard[newRow][newCol] === player) {
                            count++;
                        } else if (gameBoard[newRow][newCol] !== 0) {
                            blocked++;
                            break;
                        } else {
                            break;
                        }
                    }

                    if (count >= 5) {
                        score += 10000;
                    } else if (count === 4 && blocked === 0) {
                        score += 1000;
                    } else if (count === 4 && blocked === 1) {
                        score += 100;
                    } else if (count === 3 && blocked === 0) {
                        score += 50;
                    } else if (count === 3 && blocked === 1) {
                        score += 10;
                    } else if (count === 2 && blocked === 0) {
                        score += 5;
                    }
                }

                gameBoard[row][col] = 0;

                if (aiDifficulty === 'easy') {
                    score *= 0.8;
                    score += Math.random() * 20;
                } else if (aiDifficulty === 'hard') {
                    score *= 1.2;
                }

                return score;
            }

            function scheduleAIMove() {
                clearTimeout(aiTimer);
                aiTimer = setTimeout(() => {
                    aiTimer = null;
                    makeAIMove();
                }, 320);
            }

            function makeAIMove() {
                if (!gameActive || currentPlayer !== aiPlayer) return;

                // 有棋子时才计算候选区域，否则直接下天元
                let hasStone = false;
                for (let i = 0; i < BOARD_SIZE && !hasStone; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] !== 0) { hasStone = true; break; }
                    }
                }

                let bestScore = -Infinity;
                let bestMove = null;
                const opponent = aiPlayer === 1 ? 2 : 1;

                if (!hasStone) {
                    bestMove = { row: 7, col: 7 };
                } else {
                    for (let i = 0; i < BOARD_SIZE; i++) {
                        for (let j = 0; j < BOARD_SIZE; j++) {
                            if (gameBoard[i][j] !== 0) continue;
                            if (!withinReach(i, j)) continue; // 只在已有棋子附近搜索，提速

                            const aiScore = evaluatePosition(i, j, aiPlayer);
                            const opponentScore = evaluatePosition(i, j, opponent);

                            let finalScore;
                            if (aiDifficulty === 'easy') {
                                finalScore = aiScore * 0.7 + opponentScore * 0.3;
                            } else if (aiDifficulty === 'hard') {
                                finalScore = aiScore * 0.6 + opponentScore * 0.4;
                            } else {
                                finalScore = aiScore * 0.5 + opponentScore * 0.5;
                            }

                            finalScore += Math.random() * 10;

                            if (finalScore > bestScore) {
                                bestScore = finalScore;
                                bestMove = { row: i, col: j };
                            }
                        }
                    }
                }

                if (!bestMove) bestMove = { row: 7, col: 7 };

                gameBoard[bestMove.row][bestMove.col] = aiPlayer;
                moveHistory.push({ row: bestMove.row, col: bestMove.col, player: aiPlayer });
                lastMove = { row: bestMove.row, col: bestMove.col };

                const win = findWin(bestMove.row, bestMove.col, aiPlayer);
                if (win) {
                    winCells = win;
                    drawBoard();
                    updateGameStatus();
                    showWinModal(aiPlayer);
                    return;
                }

                if (checkDraw()) {
                    drawBoard();
                    updateGameStatus();
                    endWithDraw();
                    return;
                }

                currentPlayer = aiPlayer === 1 ? 2 : 1;
                drawBoard();
                updateGameStatus();
            }

            // 判断该点周围 2 格内是否有棋子（大幅缩小搜索范围）
            function withinReach(row, col) {
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        const r = row + dr, c = col + dc;
                        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) continue;
                        if (gameBoard[r][c] !== 0) return true;
                    }
                }
                return false;
            }

            /* ============================================================
             *  5. 交互
             * ============================================================ */
            function eventToCell(e) {
                const rect = canvas.getBoundingClientRect();
                if (!rect.width || !rect.height) return null;

                // canvas 后备缓冲与 CSS 尺寸严格等比，这里换算到逻辑坐标
                const x = (e.clientX - rect.left) * (cssSize / rect.width);
                const y = (e.clientY - rect.top) * (cssSize / rect.height);

                const col = Math.round((x - origin) / cell);
                const row = Math.round((y - origin) / cell);
                if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return null;

                // 距离交叉点太远则忽略，避免“点空”落子
                const [px, py] = toXY(row, col);
                if (Math.hypot(x - px, y - py) > cell * 0.62) return null;

                return { row, col };
            }

            function tryPlace(row, col) {
                if (net.active) {
                    if (!net.roomId) { toast('先匹配对手或创建房间'); return; }
                    if (net.status !== 'playing') { toast('对局还没开始'); return; }
                    if (net.pending) { toast('先回应对方的请求'); return; }
                    if (currentPlayer !== net.color) { toast('还没轮到你落子'); return; }
                    if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
                    if (gameBoard[row][col] !== 0) return;
                    if (net.movePending) return;
                    net.movePending = true;
                    netMove(row, col).finally(() => { net.movePending = false; });
                    return;
                }

                if (!gameActive) return;
                if (isAgainstAI && currentPlayer === aiPlayer) return;
                if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
                if (gameBoard[row][col] !== 0) return;

                gameBoard[row][col] = currentPlayer;
                moveHistory.push({ row, col, player: currentPlayer });
                lastMove = { row, col };
                hoverCell = null;

                const win = findWin(row, col, currentPlayer);
                if (win) {
                    winCells = win;
                    drawBoard();
                    updateGameStatus();
                    showWinModal(currentPlayer);
                    return;
                }

                if (checkDraw()) {
                    drawBoard();
                    updateGameStatus();
                    endWithDraw();
                    return;
                }

                currentPlayer = currentPlayer === 1 ? 2 : 1;
                drawBoard();
                updateGameStatus();

                if (isAgainstAI && currentPlayer === aiPlayer) scheduleAIMove();
            }

            canvas.addEventListener('pointerdown', (e) => {
                const pos = eventToCell(e);
                if (pos) tryPlace(pos.row, pos.col);
            });

            canvas.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'touch') return;

                if (net.active) {
                    if (net.status !== 'playing' || currentPlayer !== net.color) {
                        if (hoverCell) { hoverCell = null; requestDraw(); }
                        return;
                    }
                } else if (isAgainstAI && currentPlayer === aiPlayer) {
                    return;
                }

                const pos = eventToCell(e);
                const next = pos ? { row: pos.row, col: pos.col } : null;

                const changed = (!!next !== !!hoverCell) ||
                    (next && hoverCell && (next.row !== hoverCell.row || next.col !== hoverCell.col));

                if (changed) {
                    hoverCell = next;
                    requestDraw();
                }
            });

            canvas.addEventListener('pointerleave', () => {
                if (hoverCell) {
                    hoverCell = null;
                    requestDraw();
                }
            });

            /* ============================================================
             *  6. 设置
             * ============================================================ */
            function setGameMode(mode) {
                if (mode === 'online' && net.active) return;

                // 离开联机模式时先退房
                if (net.active && mode !== 'online') {
                    net.active = false;
                    stopLobbyPolling();
                    hideOverlay();
                    reqModal.classList.add('hidden');
                    netLeave(true);
                }

                isAgainstAI = mode === 'ai';
                aiDifficultyRow.style.display = mode === 'ai' ? 'block' : 'none';
                onlinePanel.style.display = mode === 'online' ? 'block' : 'none';

                [[humanBtn, mode === 'human'], [aiBtn, mode === 'ai'], [onlineBtn, mode === 'online']]
                    .forEach(([btn, on]) => {
                        if (on) {
                            btn.classList.remove('bg-gray-200', 'hover:bg-gray-300', 'text-gray-700');
                            btn.classList.add('bg-primary/80', 'hover:bg-primary', 'text-white');
                        } else {
                            btn.classList.remove('bg-primary/80', 'hover:bg-primary', 'text-white');
                            btn.classList.add('bg-gray-200', 'hover:bg-gray-300', 'text-gray-700');
                        }
                    });

                if (mode === 'online') enterOnlineLobby();
                else resetGame();
            }

            function setAIDifficulty(difficulty) {
                aiDifficulty = difficulty;
            }

            /* ---------------- 按钮与事件 ---------------- */
            restartBtn.addEventListener('click', () => {
                if (net.active) {
                    if (!net.roomId || !net.oppJoined) { toast('等对手进来再重开'); return; }
                    if (net.pending && net.pending.by === net.color) { netAction('cancel-request'); toast('已取消请求'); return; }
                    if (net.pending) { toast('先回应对方的请求'); return; }
                    netAction('restart-request');
                    toast('已向对手发起重开请求', 2600);
                    return;
                }
                resetGame();
            });

            undoBtn.addEventListener('click', () => {
                if (net.active) {
                    if (!net.roomId) { toast('还没进入房间'); return; }
                    if (net.status !== 'playing') { toast('对局还没开始'); return; }
                    if (net.pending && net.pending.by === net.color) { netAction('cancel-request'); toast('已取消请求'); return; }
                    if (net.pending) { toast('先回应对方的请求'); return; }
                    netAction('undo-request');
                    toast('已向对手发起悔棋请求', 2600);
                    return;
                }
                undoMove();
            });

            newGameBtn.addEventListener('click', () => {
                if (net.active) {
                    hideWinModal();
                    if (net.status === 'finished') netAction('rematch');
                    return;
                }
                resetGame();
            });

            // 联机时点遮罩可以关掉结果弹窗，方便复盘棋盘
            winModal.addEventListener('click', (e) => {
                if (net.active && e.target === winModal) hideWinModal();
            });

            humanBtn.addEventListener('click', () => setGameMode('human'));
            aiBtn.addEventListener('click', () => setGameMode('ai'));
            onlineBtn.addEventListener('click', () => setGameMode('online'));
            aiDifficultyEl.addEventListener('change', (e) => setAIDifficulty(e.target.value));

            quickBtn.addEventListener('click', netQuick);
            createRoomBtn.addEventListener('click', netCreate);
            joinRoomBtn.addEventListener('click', () => netJoin(roomInput.value));
            roomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') netJoin(roomInput.value); });
            copyLinkBtn.addEventListener('click', copyInviteLink);
            overlayCopy.addEventListener('click', copyInviteLink);
            leaveBtn.addEventListener('click', async () => {
                await netLeave(false);
                toast('已退出房间');
            });

            reqAccept.addEventListener('click', () => {
                const t = net.pending && net.pending.type;
                reqModal.classList.add('hidden');
                if (t) netAction(t.replace('-request', '-accept'));
            });
            reqReject.addEventListener('click', () => {
                const t = net.pending && net.pending.type;
                reqModal.classList.add('hidden');
                if (t) netAction(t.replace('-request', '-reject'));
            });

            /* ============================================================
             *  7. 初始化：尺寸自适应（容器变化 / 系统缩放 / 窗口尺寸都会重算）
             * ============================================================ */
            if (window.ResizeObserver) {
                new ResizeObserver(() => resizeCanvas()).observe(boardWrap);
            }
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));
            // 显示器 DPR 变化（拖到不同缩放的屏幕）时自动重绘
            const dprMedia = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
            if (dprMedia.addEventListener) {
                dprMedia.addEventListener('change', resizeCanvas);
            }

            resizeCanvas();
            updateGameStatus();
            startTimer();

            // 切回前台立刻补一次状态，避免后台降频期间错过对手落子
            document.addEventListener('visibilitychange', () => {
                if (net.active && net.roomId) schedulePoll(document.hidden ? POLL_HIDDEN_MS : 120);
            });

            // 支持 ?room=1234 直接进房（邀请链接就是靠这个）
            const urlRoom = new URLSearchParams(location.search).get('room');
            if (urlRoom && /^\d{3,5}$/.test(urlRoom)) {
                setGameMode('online');
                autoJoinFromUrl(urlRoom);
            }
        });
    </script>
</body>
</html>
